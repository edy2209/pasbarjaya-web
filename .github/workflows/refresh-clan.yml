name: Auto Refresh Clan Data

on:
  schedule:
    - cron: '*/30 * * * *'  # Setiap 30 menit
  workflow_dispatch:        # Bisa trigger manual dari GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh CoC Clan Cache
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pasbarjaya.vercel.app/api/cron/refresh-clan)
          echo "HTTP Status: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Clan data refreshed successfully"
          else
            echo "⚠️ Refresh returned status $response (stale cache will be used)"
          fi
