name: Auto Refresh Clan Data

on:
  schedule:
    - cron: '*/30 * * * *'  # Setiap 30 menit
  workflow_dispatch:        # Bisa trigger manual juga dari GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh CoC Clan Cache
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-refresh-secret: ${{ secrets.REFRESH_SECRET }}" \
            https://pasbarjaya.vercel.app/api/clan/refresh)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "::warning::Refresh failed with status $status"
          fi
