name: Auto Refresh Clan Data

on:
  schedule:
    - cron: '*/15 * * * *'  # Berjalan otomatis setiap 15 menit
  workflow_dispatch:        # Bisa di-trigger manual kapan saja dari GitHub tab Actions

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Clan Cache Refresh via API
        run: |
          echo "🔄 Meminta Vercel melakukan refresh data klan dari Supercell API..."
          response=$(curl -s -w "\n%{http_code}" https://pasbarjaya.vercel.app/api/cron/refresh-clan)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response Body: $body"
          echo "HTTP Code: $http_code"

          if [ "$http_code" -eq 200 ]; then
            echo "✅ Data klan berhasil diperbarui di MongoDB!"
          else
            echo "❌ Gagal refresh data (Status: $http_code)"
            exit 1
          fi
